syntax = "proto3";

package optiswift.proto.nutmeg;

option go_package = "github.com/optiswift/turmeric/generated/nutmeg;proto";

import "google/protobuf/timestamp.proto";

service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
}

message SendNotificationRequest {
  string user_id = 1;
  string template_id = 2; // The template must support the requested channels
  map<string, string> template_variables = 3;

  repeated ChannelConfig channels = 4;

  string correlation_id = 5; // Needed for idempotency and audit linking

  // Files attached to the notification. Only honoured by channels that
  // support attachments (email); other channels ignore them.
  repeated Attachment attachments = 6;
}

message Attachment {
  string filename = 1;
  bytes content = 2;
  string content_type = 3; // MIME type, e.g. "application/pdf"
}

message ChannelConfig {
  ChannelType type = 1;

  oneof target_override {
    string email_address = 2;
    string phone_number = 3;
    string device_token = 4;
  }
}

enum ChannelType {
  CHANNEL_TYPE_EMAIL = 0;
  CHANNEL_TYPE_SMS = 1;
  CHANNEL_TYPE_PUSH = 2;
  CHANNEL_TYPE_IN_APP = 3;
}

message SendNotificationResponse {
  map<string, DeliveryStatus> channel_statuses = 2;
}

enum DeliveryStatus {
  DELIVERY_STATUS_QUEUED = 0;
  DELIVERY_STATUS_SENT = 1;
  DELIVERY_STATUS_FAILED = 2;
}

// NotificationInboxService is the read side of in-app notifications: the
// persistent inbox a user sees inside the app. Rows are written when a
// notification is dispatched on CHANNEL_TYPE_IN_APP.
service NotificationInboxService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
}

message ListNotificationsRequest {
  string user_id = 1;
  int32 page_size = 2; // Server clamps: default 20, max 100
  int32 page = 3;      // Zero-indexed page number
  bool unread_only = 4;
}

message InboxNotification {
  string id = 1;
  string title = 2;
  string body = 3;
  string template_id = 4;
  string correlation_id = 5;
  bool read = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListNotificationsResponse {
  repeated InboxNotification notifications = 1;
  int64 total = 2; // Total rows matching the filter, across all pages
  int32 page = 3;
  int32 page_size = 4;
}

message GetUnreadCountRequest {
  string user_id = 1;
}

message GetUnreadCountResponse {
  int64 count = 1;
}

message MarkReadRequest {
  string user_id = 1;
  repeated string notification_ids = 2; // Ignored when all = true
  bool all = 3;
}

message MarkReadResponse {
  int32 updated_count = 1;
}